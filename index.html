<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wall of Voices - Kartini</title>

  <!-- Font Kartini style -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <!-- Firebase (compat biar aman di HTML biasa) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <style>
    body {
      margin: 0;
      font-family: serif;
      background-color: #f8f1e5;
      background-image: url("data:image/svg+xml,%3Csvg width='200' height='200' viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23d4af37' stroke-width='1.5' opacity='0.18'%3E%3Cpath d='M100 20 C70 50,70 90,100 120 C130 90,130 50,100 20Z'/%3E%3Cpath d='M100 80 C70 110,70 150,100 180 C130 150,130 110,100 80Z'/%3E%3Cpath d='M20 100 C50 70,90 70,120 100 C90 130,50 130,20 100Z'/%3E%3Cpath d='M80 100 C110 70,150 70,180 100 C150 130,110 130,80 100Z'/%3E%3C/g%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
      border: 4px solid #d4af37;
      background: rgba(255, 250, 243, 0.9);
      backdrop-filter: blur(2px);
      border-radius: 16px;
      margin-top: 20px;
      position: relative;
      z-index: 2;
    }

    h1 {
      text-align: center;
      font-family: 'Great Vibes', cursive;
      font-size: 42px;
    }

    textarea, input {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 10px;
      padding: 10px;
      width: 100%;
      background: #d4af37;
      border: none;
      color: white;
      border-radius: 8px;
      font-weight: bold;
    }

    .card {
      margin-top: 15px;
      padding: 12px;
      border: 1px solid #d4af37;
      border-radius: 10px;
      background: #fffaf3;
    }

    .like {
      margin-top: 10px;
      cursor: pointer;
    }

    /* bunga jatuh */
    .flower {
      position: fixed;
      top: -50px;
      font-size: 20px;
      animation: fall linear infinite;
      opacity: 0.7;
      z-index: 1;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh);
      }
    }
  </style>
</head>
<body>

  <div id="flowers"></div>

  <div class="container">
    <h1>Wall of Voices</h1>
    <p style="text-align:center"><i>"Kalau aku jadi Kartini di masa kini, aku ingin..."</i></p>
    <p style="text-align:center;font-size:12px">by garvanta Ulluvara</p>

    <input id="name" placeholder="Nama (opsional)">
    <textarea id="text" placeholder="Tulis harapanmu..."></textarea>
    <button onclick="kirim()">Kirim</button>

    <div id="list"></div>
  </div>

  <script>
    // FIREBASE
    const firebaseConfig = {
      apiKey: "AIzaSyDU-bOKDpiIR9bv3Z2J-O9JkDfM9QoJJHI",
      authDomain: "kartini-62b5d.firebaseapp.com",
      projectId: "kartini-62b5d",
      storageBucket: "kartini-62b5d.firebasestorage.app",
      messagingSenderId: "961806231460",
      appId: "1:961806231460:web:2222893ed9f8b438644331",
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function kirim() {
      const text = document.getElementById("text").value;
      const name = document.getElementById("name").value || "Anonim";

      if (!text) return;

      db.collection("voices").add({
        text,
        name,
        likes: 0,
        createdAt: Date.now()
      });

      document.getElementById("text").value = "";
    }

    function like(id, current) {
      db.collection("voices").doc(id).update({
        likes: current + 1
      });
    }

    db.collection("voices").orderBy("createdAt", "desc")
      .onSnapshot(snapshot => {
        const list = document.getElementById("list");
        list.innerHTML = "";

        snapshot.forEach(doc => {
          const d = doc.data();

          list.innerHTML += `
            <div class="card">
              <div>${d.text}</div>
              <small>— ${d.name}</small>
              <div class="like" onclick="like('${doc.id}', ${d.likes || 0})">
                ❤️ ${d.likes || 0}
              </div>
            </div>
          `;
        });
      });

    // bunga jatuh (FIX: tunggu DOM siap)
    document.addEventListener("DOMContentLoaded", () => {
      const flowerContainer = document.getElementById("flowers");

      function createFlower() {
        const flower = document.createElement("div");
        flower.classList.add("flower");
        flower.innerHTML = "🌸";
        flower.style.left = Math.random() * 100 + "vw";
        flower.style.animationDuration = (5 + Math.random() * 5) + "s";
        flowerContainer.appendChild(flower);

        setTimeout(() => {
          flower.remove();
        }, 10000);
      }

      setInterval(createFlower, 500);
    });
  </script>

</body>
</html>
